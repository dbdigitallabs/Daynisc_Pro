name: ai_erp_platform
description: AI-powered ERP & Business Automation Platform for Indian SMEs
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Network ─────────────────────────────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── Local Storage ───────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # ── Media / File ────────────────────────────────────────────────────────────
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  camera: ^0.10.5+9
  flutter_image_compress: ^2.2.0

  # ── PDF ─────────────────────────────────────────────────────────────────────
  syncfusion_flutter_pdfviewer: ^33.2.6
  pdf: ^3.10.8
  printing: ^5.12.0

  # ── Charts ──────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── UI / UX ─────────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0

  # ── Utilities ───────────────────────────────────────────────────────────────
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  uuid: ^4.4.0

  # ── Push Notifications ──────────────────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # ── Barcode / QR ────────────────────────────────────────────────────────────
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0

  # ── Icons ───────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0

  # ── Google Fonts (Inter) ────────────────────────────────────────────────────
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

