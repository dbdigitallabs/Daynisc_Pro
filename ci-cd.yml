# ── AI ERP Platform — CI/CD Pipeline ──────────────────────────────────────────
# Runs on: push to main (production deploy) or PR (test only)

name: AI ERP CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: ai-erp-prod
  AWS_REGION: ap-south-1

jobs:

  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: erp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-32-chars-minimum-xx
          SECRET_KEY: test-secret-key-32-chars-minimum-xx
          DEBUG: "true"
          GEMINI_API_KEY: "test"
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage report --min-coverage=60

  # ── Web Dashboard Build ───────────────────────────────────────────────────
  web-build:
    name: Web Dashboard Build (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_dashboard/package-lock.json

      - name: Install & Build
        working-directory: web_dashboard
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.aierp.in/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web_dashboard/dist/
          retention-days: 7

  # ── Flutter Build ─────────────────────────────────────────────────────────
  flutter-build:
    name: Flutter App Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Build APK
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.aierp.in/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ── Docker Build & Push ───────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, web-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/ai-erp-api:latest
            ${{ env.ECR_REGISTRY }}/ai-erp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web_dashboard/dist

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web_dashboard
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/ai-erp-web:latest
            ${{ env.ECR_REGISTRY }}/ai-erp-web:${{ github.sha }}

  # ── Deploy to EKS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.aierp.in

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Run DB migrations
        run: |
          kubectl exec -it deployment/api -n ai-erp -- \
            alembic upgrade head

      - name: Deploy API
        run: |
          kubectl set image deployment/api \
            api=${{ env.ECR_REGISTRY }}/ai-erp-api:${{ github.sha }} \
            -n ai-erp
          kubectl rollout status deployment/api -n ai-erp --timeout=300s

      - name: Deploy workers
        run: |
          kubectl set image deployment/worker-ai \
            worker=${{ env.ECR_REGISTRY }}/ai-erp-api:${{ github.sha }} \
            -n ai-erp
          kubectl set image deployment/worker-erp \
            worker=${{ env.ECR_REGISTRY }}/ai-erp-api:${{ github.sha }} \
            -n ai-erp

      - name: Deploy web dashboard
        run: |
          kubectl set image deployment/web \
            web=${{ env.ECR_REGISTRY }}/ai-erp-web:${{ github.sha }} \
            -n ai-erp
          kubectl rollout status deployment/web -n ai-erp --timeout=120s

      - name: Verify health
        run: |
          sleep 10
          curl --fail https://api.aierp.in/health || exit 1
          echo "✅ Deployment successful"

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ AI ERP Platform deployed to production — commit ${{ github.sha[:7] }}"}'

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/api -n ai-erp
          kubectl rollout undo deployment/web -n ai-erp
          echo "⚠️ Rollback triggered"
