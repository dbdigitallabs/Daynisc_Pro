version: "3.9"

# ── AI ERP Platform — Docker Compose ──────────────────────────────────────────
# Starts: API, Celery workers, PostgreSQL, Redis, Nginx
# Usage:
#   cp .env.example .env        (fill in secrets)
#   docker-compose up -d

services:

  # ── API Gateway / Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs:/etc/ssl/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://erp:${DB_PASSWORD}@postgres:5432/erp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - TALLY_DEFAULT_URL=http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows container to reach host PC (for TallyPrime)
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"  # Direct access for dev (mobile app / curl testing)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery AI Worker (high priority) ──────────────────────────────────────
  worker-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A shared.tasks.celery_app worker -Q ai -c 4 --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://erp:${DB_PASSWORD}@postgres:5432/erp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      replicas: 2

  # ── Celery ERP Sync Worker ─────────────────────────────────────────────────
  worker-erp:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A shared.tasks.celery_app worker -Q erp -c 2 --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://erp:${DB_PASSWORD}@postgres:5432/erp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - TALLY_DEFAULT_URL=http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Reach TallyPrime on host PC
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ── Celery Notification Worker ─────────────────────────────────────────────
  worker-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A shared.tasks.celery_app worker -Q notifications -c 2 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ── Celery Beat Scheduler ──────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A shared.tasks.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"  # Remove in production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c checkpoint_completion_target=0.9

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React Web Dashboard ────────────────────────────────────────────────────
  web:
    build:
      context: ./web_dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # ── Flower (Celery monitoring) — dev only ──────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A shared.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
